version: "1"
id: unsafe.production.deploy
description: An intentionally unsafe deployment contract used in the demo
actor:
  id: deploy-agent
  type: agent
delegation:
  principal: user:release-manager
capability: deployment.replace
effect: destructive
resources:
  - deployment:production/api
risk: critical
approval:
  mode: implicit
recovery:
  reversible: false
notification:
  timing: after
cost:
  kind: free
evidence:
  outputs: []
