apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-devops-app
  template:
    metadata:
      labels:
        app: sre-devops-app
    spec:
      containers:
        - name: sre-devops-app
          image: sre-devops-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
